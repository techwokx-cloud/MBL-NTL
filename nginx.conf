# Nginx configuration for MBL–NTL SulNOxEco Ghana
# Deploy behind Nginx with SSL via Let's Encrypt (Certbot)

upstream nextjs_backend {
  # Docker container or local Node.js process
  server 127.0.0.1:3000;
  keepalive 64;
}

# HTTP to HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name www.mbl-ntlsulnox.com mbl-ntlsulnox.com;
  return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.mbl-ntlsulnox.com mbl-ntlsulnox.com;

  # SSL certificates (replace paths after running certbot)
  ssl_certificate /etc/letsencrypt/live/www.mbl-ntlsulnox.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.mbl-ntlsulnox.com/privkey.pem;

  # SSL best practices
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Logging
  access_log /var/log/nginx/sulnoxeco.access.log;
  error_log /var/log/nginx/sulnoxeco.error.log;

  # Root directory (for static files served by Nginx)
  root /app/public;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

  # Cache control for static assets
  location /_next/static/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /static/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Public files
  location /public/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Proxy to Next.js application
  location / {
    proxy_pass http://nextjs_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Health check endpoint (add to Next.js if needed)
  location /api/health {
    proxy_pass http://nextjs_backend;
    access_log off;
  }

  # Prevent access to sensitive files
  location ~ /\. {
    deny all;
  }

  location ~ /\.env {
    deny all;
  }

  location ~ /\.git {
    deny all;
  }

  # Redirect www to non-www (optional, remove if you prefer www)
  # if ($http_host ~ ^www\.(.*)$ ) {
  #   return 301 https://$1$request_uri;
  # }
}

